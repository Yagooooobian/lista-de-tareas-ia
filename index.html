<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de Tareas IA</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #81ecec 0%, #dfe6e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .contenedor {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(52, 152, 219, 0.10), 0 1.5px 7px #81ecec54;
      padding: 38px 32px 30px 32px;
      max-width: 420px;
      width: 100%;
      margin: 26px 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    h1 {
      color: #0984e3;
      font-weight: 800;
      font-size: 2.1em;
      letter-spacing: 1.5px;
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 0 3px 14px #81ecec22;
    }
    #contador-tareas {
      font-size: 1.09em;
      color: #00b894;
      background: #dff9fb;
      display: flex;
      justify-content: space-between;
      border-radius: 9px;
      padding: 7px 20px;
      margin-bottom: 4px;
      box-shadow: 0px 3px 13px #00b89426;
      border: 1px solid #81ecec80;
      font-weight: 600;
      align-items: center;
    }
    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 17px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(95deg,#dff9fb 75%, #a7ffeb 100%);
      box-shadow: 0 2px 8px #00b89419;
      border-radius: 12px;
      padding: 14px 12px;
      transition: box-shadow 0.20s, background .22s;
      min-height: 44px;
      border: 1px solid #d1ecee;
      position: relative;
    }
    .tarea-completada {
      text-decoration: line-through;
      color: #636e72;
      background: none;
      transition: color .2s;
    }
    li:hover {
      box-shadow: 0 4.5px 18px #0984e340;
      background: linear-gradient(95deg, #eaf6fb 60%, #a7ffeb 99%);
    }
    input[type="checkbox"] {
      transform: scale(1.32);
      accent-color: #00b894;
      cursor: pointer;
      margin-right: 4px;
    }
    button {
      background: linear-gradient(90deg,#0984e3 80%,#81ecec 100%);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 13px;
      cursor: pointer;
      font-weight: 600;
      margin-left: auto;
      font-size: 0.93em;
      box-shadow: 0 2px 8px #0984e32b;
      transition: background 0.17s, color 0.15s;
    }
    button:hover {
      background: linear-gradient(90deg, #00b894 70%, #0984e3 100%);
      color: #fff;
    }
    input[type="text"] {
      padding: 10px 13px;
      border-radius: 8px;
      border: 2px solid #81ecec;
      margin-right: 11px;
      width: 74%;
      font-size: 1em;
      background: #dff9fb;
      color: #0984e3;
      outline: none;
      transition: border .17s;
      font-weight: 600;
    }
    input[type="text"]:focus {
      border-color: #0984e3;
      background: #eaf6fb;
      color: #00b894;
    }
    #agregar {
      padding: 9px 18px;
      background: linear-gradient(93deg, #00b894 80%, #0984e3 100%);
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 1em;
      font-weight: 700;
      box-shadow: 0 2px 12px #0984e322;
      margin-left: 8px;
      transition: background 0.18s;
      letter-spacing: 0.5px;
    }
    #agregar:hover {
      background: linear-gradient(110deg, #0984e3 10%, #00b894 60%);
      color: #fff;
    }
    .editable {
      outline: 2px solid #00b89488;
      background: #a7ffeb3a;
      border-radius: 4px;
      padding: 2px 4px;
    }
    @media (max-width: 600px) {
      .contenedor {
        margin: 0;
        padding: 18px 7vw 15px 7vw;
        border-radius: 0;
        box-shadow: none;
        min-height: 100vh;
      }
      input[type="text"] { width: 54vw; }
      #contador-tareas { font-size: .97em; padding: 7px 4vw;}
      h1 { font-size: 1.5em; }
      ul { gap: 7.5px;}
    }
    /* Visual oculto para label accesible */
    .visually-hidden {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>Lista de Tareas</h1>
    <div id="contador-tareas" aria-live="polite" aria-atomic="true">
      <span>Pendientes: <span id="pendientes">0</span></span> 
      <span>Completadas: <span id="completadas">0</span></span>
    </div>
    <form id="formulario-tarea" autocomplete="off" style="display:flex; align-items: center; gap:0;">
      <label for="nueva-tarea" class="visually-hidden">Nueva tarea:</label>
      <input type="text" id="nueva-tarea" placeholder="Escribe una nueva tarea..." required aria-label="Nueva tarea">
      <button type="submit" id="agregar">Agregar</button>
    </form>
    <ul id="lista-tareas" role="list"></ul>
  </div>
  <script>
    const STORAGE_KEY = 'tareas-ia-v2';

    const formulario = document.getElementById('formulario-tarea');
    const nuevaTareaInput = document.getElementById('nueva-tarea');
    const listaTareas = document.getElementById('lista-tareas');
    const pendientesSpan = document.getElementById('pendientes');
    const completadasSpan = document.getElementById('completadas');

    function obtenerTareas() {
      try {
        const tareas = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(tareas) ? tareas : [];
      } catch {
        return [];
      }
    }
    function guardarTareas(tareas) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tareas));
    }

    function renderTareas() {
      listaTareas.innerHTML = '';
      const tareas = obtenerTareas();
      let pendientes = 0, completadas = 0;
      tareas.forEach((tarea, idx) => {
        const li = document.createElement('li');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = tarea.completada;
        checkbox.id = `tarea-chk-${idx}`;
        checkbox.setAttribute('aria-label', 'Marcar como completada');
        if (tarea.completada) completadas++; else pendientes++;

        const span = document.createElement('span');
        span.textContent = tarea.texto;
        if (tarea.completada) span.classList.add('tarea-completada');
        span.tabIndex = 0;
        span.title = 'Haz doble clic para editar';
        span.addEventListener('dblclick', editaTarea);
        span.addEventListener('keydown', e => {
          if(e.key === "Enter" || e.key === " ") editaTarea.call(span, e);
        });

        checkbox.addEventListener('change', function() {
          tareas[idx].completada = this.checked;
          guardarTareas(tareas);
          renderTareas();
        });

        const borrarBtn = document.createElement('button');
        borrarBtn.textContent = 'Borrar';
        borrarBtn.title = 'Eliminar tarea';
        borrarBtn.addEventListener('click', function() {
          tareas.splice(idx, 1);
          guardarTareas(tareas);
          renderTareas();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(borrarBtn);
        listaTareas.appendChild(li);
      });
      pendientesSpan.textContent = pendientes;
      completadasSpan.textContent = completadas;
    }

    function editaTarea(e) {
      const span = e.currentTarget || e.target;
      if (span.classList.contains('editable')) return;
      const textoOriginal = span.textContent;
      span.contentEditable = true;
      span.classList.add('editable');
      span.focus();
      document.execCommand('selectAll', false, null);

      function guardar() {
        span.contentEditable = false;
        span.classList.remove('editable');
        const nuevoTexto = span.textContent.trim();
        const tareas = obtenerTareas();
        const idx = Array.prototype.indexOf.call(listaTareas.children, span.parentNode);
        if (nuevoTexto && nuevoTexto !== textoOriginal) {
          tareas[idx].texto = nuevoTexto;
        } else if (!nuevoTexto) {
          tareas.splice(idx, 1);
        }
        guardarTareas(tareas);
        renderTareas();
      }

      function cancelarEdicion(evt) {
        if(evt.type === "keydown" && evt.key !== "Enter")return;
        span.textContent = textoOriginal;
        span.contentEditable = false;
        span.classList.remove('editable');
      }

      span.addEventListener('blur', guardar, {once:true});
      span.addEventListener('keydown', function(evt){
        if(evt.key === "Enter") {
          evt.preventDefault();
          guardar();
        }
        if(evt.key === "Escape") {
          evt.preventDefault();
          cancelarEdicion(evt);
        }
      });
    }

    formulario.addEventListener('submit', function(e) {
      e.preventDefault();
      const textoTarea = nuevaTareaInput.value.trim();
      if (!textoTarea) return;
      const tareas = obtenerTareas();
      tareas.push({ texto: textoTarea, completada: false });
      guardarTareas(tareas);
      nuevaTareaInput.value = "";
      nuevaTareaInput.focus();
      renderTareas();
    });

    nuevaTareaInput.addEventListener('keyup', function(e){
      if(e.key === "Enter"){
        formulario.requestSubmit();
      }
    });

    renderTareas();
  </script>
</body>
</html>
