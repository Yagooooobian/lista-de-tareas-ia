<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de Tareas IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f0f0f0;
    }
    h1 {
      color: #333;
    }
    .tarea-completada {
      text-decoration: line-through;
      color: #aaa;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      padding: 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #ddd;
    }
    button {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 5px 10px;
      cursor: pointer;
    }
    button:hover {
      background: #c0392b;
    }
    input[type="text"] {
      padding: 7px;
      border-radius: 4px;
      border: 1px solid #ccc;
      margin-right: 8px;
      width: 220px;
      font-size: 1em;
    }
    #agregar {
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 3px;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 1em;
    }
    #agregar:hover {
      background: #27ae60;
    }
  </style>
</head>
<body>
  <h1>Lista de Tareas</h1>

  <form id="formulario-tarea">
    <input type="text" id="nueva-tarea" placeholder="Escribe una nueva tarea..." required>
    <button type="submit" id="agregar">Agregar</button>
  </form>

  <ul id="lista-tareas"></ul>

  <script>
    const formulario = document.getElementById('formulario-tarea');
    const nuevaTareaInput = document.getElementById('nueva-tarea');
    const listaTareas = document.getElementById('lista-tareas');

    function crearElementoTarea(texto) {
      const li = document.createElement('li');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';

      const span = document.createElement('span');
      span.textContent = texto;

      // Cambia el estilo si está marcada como completada
      checkbox.addEventListener('change', function() {
        span.classList.toggle('tarea-completada', this.checked);
      });

      const borrarBtn = document.createElement('button');
      borrarBtn.textContent = 'Borrar';

      borrarBtn.addEventListener('click', function() {
        listaTareas.removeChild(li);
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(borrarBtn);

      return li;
    }

    formulario.addEventListener('submit', function(e) {
      e.preventDefault();
      const textoTarea = nuevaTareaInput.value.trim();
      if (textoTarea !== "") {
        const nuevaTarea = crearElementoTarea(textoTarea);
        listaTareas.appendChild(nuevaTarea);
        nuevaTareaInput.value = "";
        nuevaTareaInput.focus();
      }
    });
  </script>
</body>
</html>
